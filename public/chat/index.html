<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>
body{margin:0;background:#f3f4f6;color:#172033;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#2563eb;text-decoration:none}.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:16px}.messages{min-height:55vh;display:flex;flex-direction:column;gap:12px}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;white-space:pre-wrap}.user{align-self:flex-end;background:#2563eb;color:white}.assistant{align-self:flex-start;background:#eef2ff}form{display:flex;gap:8px;margin-top:12px}textarea{flex:1;resize:vertical;min-height:44px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}button,select,input{padding:9px;border:1px solid #d1d5db;border-radius:8px;background:white;font:inherit}button{background:#2563eb;color:#fff;border:0;cursor:pointer}label{font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls input{width:220px}</style></head>
<body><main><header><h1>💬 หน้าต่าง Chat</h1><a href="/">กลับหน้าแรก</a></header><section class="panel"><div class="controls"><label>Provider <select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model <input id="model" value="gemini-flash-latest"></label></div></section><section class="panel"><div id="messages" class="messages"></div><form id="form"><textarea id="message" placeholder="พิมพ์ข้อความ..." required></textarea><button>ส่ง</button></form></section></main><script src="/chat/app.js"></script></body></html>
